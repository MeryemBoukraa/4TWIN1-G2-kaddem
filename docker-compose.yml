services:
  mysql:
    image: mysql:5.7
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: microservice_ressource
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10



  ressource:
    build: ./devops_back
    image: yosrba/yosrbenamor-g2-kaddem:1.0
    container_name: ressource
    ports:
      - "8082:8082"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      spring.datasource.url: "jdbc:mysql://mysql:3306/microservice_ressource?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&max_allowed_packet=15728640"
      spring.datasource.username: "root"
      spring.datasource.password: "root"

 


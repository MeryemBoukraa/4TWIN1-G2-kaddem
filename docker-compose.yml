version: "3.0"
services:
  eureka-server:
    build: ./Back-eurika
    image: chiheb634/eureka:1.0
    container_name: eureka
    ports:
      - "8761:8761"
    environment:
      - eureka.client.service-url.defaultZone=http://eureka-server:8761/eureka/

  apigateway:
    build: ./ApiGateWay
    image: chiheb634/apigateway:1.0
    container_name: apigateway
    ports:
      - "8090:8090"
    depends_on:
      - eureka-server
      - departementService
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/

  departementService:
    build: ./departement
    image: chiheb634/departementservice:1.1
    container_name: departementService
    restart: always
    ports:
      - "8089:8089"
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/

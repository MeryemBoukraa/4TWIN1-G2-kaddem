version: '3.9'

services:
  contrat:
    build: ./contrat
    image: ablouu/contrat:1.0
    container_name: contrat
    ports:
      - "8087:8087"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka

  eureka-server:
    build: ./eurika
    image: ablouu/eurika:1.0
    container_name: eurika
    ports:
      - "8761:8761"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka

  api-gateway:
    build: ./ApiGetWay  
    image: ablouu/apigateway:1.0
    container_name: apigetaway
    ports:
      - "8090:8090"
    depends_on:
      - eureka-server
      - contrat
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka

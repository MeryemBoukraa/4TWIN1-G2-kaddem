server.servlet.context-path=/Kassil
server.port=8089
spring.application.name=EQUIPE

# ? Switch to file-based H2 database (persistent)
spring.datasource.url=jdbc:h2:file:./data/Kassil
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ? Avoid recreating the database
spring.jpa.hibernate.ddl-auto=update

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.username=user


# Disable Spring Cloud Config
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

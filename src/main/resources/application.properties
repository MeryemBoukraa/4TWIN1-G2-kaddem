spring.application.name=universite



eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
# Service
spring.application.name=universite
server.port=8082
server.servlet.context-path=/universite

# Actuator et Prometheus
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.endpoints.web.base-path=/actuator

# H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.datasource.username=louay
spring.datasource.password=
spring.datasource.url=jdbc:h2:file:./Database/Data/universite;Auto_server=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto = update
